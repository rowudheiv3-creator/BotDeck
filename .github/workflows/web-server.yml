name: Build web server (Linux)
on:
  workflow_dispatch:
  push:
    paths: ["web-server/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./... && go test ./...
      - run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o botdeck-server-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o botdeck-server-linux-arm64 .
          sha256sum botdeck-server-linux-* | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: botdeck-server
          path: |
            web-server/botdeck-server-linux-*
            web-server/SHA256SUMS
